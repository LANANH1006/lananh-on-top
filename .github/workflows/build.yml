name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tim source
        run: |
          if [ -f build.gradle ]; then
            echo "DIR=." >> $GITHUB_ENV
          else
            unzip -o ./*.zip -d proj
            echo "DIR=proj" >> $GITHUB_ENV
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build -p ${{ env.DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: LanAnhClient-jar
          path: ${{ env.DIR }}/build/libs/*.jar

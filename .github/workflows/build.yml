name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen
        run: |
          mkdir proj
          unzip -o lananh-client-source-no-shader.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build --no-daemon -p proj
      - uses: actions/upload-artifact@v4
        with:
          name: LanAnhClient-jar
          path: proj/build/libs/*.jar
